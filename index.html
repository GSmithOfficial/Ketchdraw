<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoltzDraw - Molecular Structure Editor</title>

    <!-- Boltz logo as favicon and dock/home screen icon -->
    <link rel="icon" type="image/png" href="logo/boltz.png">
    <link rel="apple-touch-icon" href="logo/boltz.png">

    <!-- Chart.js for pKa distribution plots -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- BoltzDraw styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Loading overlay - shown until RDKit + Ketcher are both ready -->
    <div class="loading-overlay" id="loading">
        <img class="loading-logo" src="logo/boltz.png" alt="Boltz">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading BoltzDraw...</div>
        <div class="loading-subtext" id="loading-status">Initializing RDKit...</div>
    </div>

    <!-- Header -->
    <header class="app-header">
        <img class="app-logo" src="logo/boltz.png" alt="Boltz">
        <h1 class="app-title">
            <span class="brand">Boltz</span><span class="product">Draw</span>
        </h1>
        <span class="app-subtitle">Molecular Structure Editor</span>
    </header>

    <!-- Main layout -->
    <div class="main-container">

        <!-- Ketcher drawing canvas -->
        <div id="ketcher-container">
            <iframe id="ketcher-frame" src="ketcher/index.html" title="Molecular structure editor"></iframe>
        </div>

        <!-- Panel collapse/expand toggle -->
        <button class="panel-toggle" id="panel-toggle" title="Toggle Properties Panel">
            <span>◀</span>
        </button>

        <!-- Properties panel -->
        <div class="properties-panel" id="properties-panel">

            <div class="panel-header">
                <div class="panel-header-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2v-4M9 21H5a2 2 0 01-2-2v-4m0-6v6"/>
                    </svg>
                    Properties
                </div>
                <div class="view-toggle">
                    <button id="view-cards" class="active">Cards</button>
                    <button id="view-pka">pKa</button>
                </div>
            </div>

            <!-- Cards view - molecule property cards rendered here -->
            <div class="molecules-list" id="molecules-list">
                <div class="no-molecules">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="3"/>
                        <circle cx="4" cy="8" r="2"/>
                        <circle cx="20" cy="8" r="2"/>
                        <circle cx="4" cy="16" r="2"/>
                        <circle cx="20" cy="16" r="2"/>
                        <path d="M6 8h3M15 8h3M6 16h3M15 16h3M12 9V6M12 18v-3"/>
                    </svg>
                    <p>Draw a molecule to see its calculated properties</p>
                </div>
            </div>

            <!-- pKa view - API call + distribution chart -->
            <div class="pka-container" id="pka-container">
                <div class="pka-input-section">
                    <label class="pka-label">Selected Molecule</label>
                    <div class="smiles-display" id="pka-smiles">Draw a molecule in the editor</div>
                    <button class="pka-calculate-btn" id="calculate-pka-btn" disabled>
                        Calculate pKa
                    </button>
                </div>
                <div class="pka-results" id="pka-results"></div>
                <div class="pka-chart-container" id="pka-chart-container">
                    <canvas id="pka-chart"></canvas>
                </div>
            </div>

            <!-- Status bar -->
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Initializing...</span>
                </div>
                <span id="molecule-count">0 molecules</span>
            </div>

        </div>
    </div>

    <!-- App entry point - ES module, imports all other JS modules -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
