<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoltzDraw - Molecular Structure Editor</title>

    <link rel="icon" type="image/png" href="logo/boltz.png">
    <link rel="apple-touch-icon" href="logo/boltz.png">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/molstar@3.45.0/build/viewer/molstar.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="loading-overlay" id="loading">
        <img class="loading-logo" src="logo/boltz.png" alt="Boltz">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading BoltzDraw...</div>
        <div class="loading-subtext" id="loading-status">Initializing RDKit...</div>
    </div>

    <header class="app-header">
        <img class="app-logo" src="logo/boltz.png" alt="Boltz">
        <nav class="app-switcher">
            <button class="mode-btn active-draw" id="btn-draw">
                <span class="btn-brand">Boltz</span><span class="btn-product">Draw</span>
            </button>
            <button class="mode-btn" id="btn-star">
                <span class="btn-brand">Boltz</span><span class="btn-product">Star</span>
            </button>
        </nav>
        <div class="header-divider"></div>
        <span class="app-subtitle" id="app-subtitle">Molecular Structure Editor</span>
    </header>

    <div class="main-container">

        <!-- BoltzDraw: Ketcher 2D canvas -->
        <div id="ketcher-container">
            <iframe id="ketcher-frame" src="ketcher/index.html" title="Molecular structure editor"></iframe>
        </div>

        <!-- BoltzStar: Molstar 3D viewer -->
        <div id="molstar-container" class="hidden">
            <div id="molstar-viewport"></div>
        </div>

        <button class="panel-toggle" id="panel-toggle" title="Toggle Properties Panel">
            <span>◀</span>
        </button>

        <div class="properties-panel" id="properties-panel">

            <div class="panel-header">
                <div class="panel-header-left">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2v-4M9 21H5a2 2 0 01-2-2v-4m0-6v6"/>
                    </svg>
                    <span id="panel-title">Properties</span>
                </div>
                <div class="view-toggle" id="view-toggle">
                    <button id="view-cards" class="active">Cards</button>
                    <button id="view-pka">pKa</button>
                </div>
            </div>

            <!-- BoltzDraw: molecule property cards -->
            <div class="molecules-list" id="molecules-list">
                <div class="no-molecules">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="3"/>
                        <circle cx="4" cy="8" r="2"/>
                        <circle cx="20" cy="8" r="2"/>
                        <circle cx="4" cy="16" r="2"/>
                        <circle cx="20" cy="16" r="2"/>
                        <path d="M6 8h3M15 8h3M6 16h3M15 16h3M12 9V6M12 18v-3"/>
                    </svg>
                    <p>Draw a molecule to see its calculated properties</p>
                </div>
            </div>

            <!-- BoltzDraw: pKa tab -->
            <div class="pka-container" id="pka-container">
                <div class="pka-input-section">
                    <label class="pka-label">Selected Molecule</label>
                    <div class="smiles-display" id="pka-smiles">Draw a molecule in the editor</div>
                    <button class="pka-calculate-btn" id="calculate-pka-btn" disabled>
                        Calculate pKa
                    </button>
                </div>
                <div class="pka-results" id="pka-results"></div>
                <div class="pka-chart-container" id="pka-chart-container">
                    <canvas id="pka-chart"></canvas>
                </div>
            </div>

            <!-- BoltzStar: viewer controls panel -->
            <div class="star-panel hidden" id="star-panel">

                <div class="star-section">
                    <label class="star-label">Load Structure</label>

                    <div class="star-input-row">
                        <input type="text"
                               id="pdb-id-input"
                               class="star-text-input"
                               placeholder="PDB ID e.g. 1ABC"
                               maxlength="4"
                               spellcheck="false"
                               autocomplete="off">
                        <button class="star-load-btn" id="load-pdb-btn">Load</button>
                    </div>

                    <div class="star-or"><span>or</span></div>

                    <label class="star-upload-label" for="structure-file-input">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        Upload .cif / .pdb file
                    </label>
                    <input type="file"
                           id="structure-file-input"
                           accept=".cif,.pdb,.mmcif"
                           style="display:none">

                    <div class="star-status hidden" id="star-load-status"></div>
                </div>

                <div class="star-section">
                    <label class="star-label">Boltz Style Preset</label>

                    <div class="preset-row">
                        <div class="preset-swatch protein-swatch"></div>
                        <span class="preset-name">Protein surface</span>
                        <span class="preset-val">blue · 30%</span>
                    </div>
                    <div class="preset-row">
                        <div class="preset-swatch ligand-swatch"></div>
                        <span class="preset-name">Ligand surface</span>
                        <span class="preset-val">yellow · solid</span>
                    </div>
                    <div class="preset-row">
                        <div class="preset-swatch transparent-swatch"></div>
                        <span class="preset-name">Background</span>
                        <span class="preset-val">transparent</span>
                    </div>

                    <button class="star-apply-btn" id="apply-preset-btn" disabled>
                        Apply Boltz Style
                    </button>
                </div>

            </div>

            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Initializing...</span>
                </div>
                <span id="molecule-count">0 molecules</span>
            </div>

        </div>
    </div>

    <script type="module" src="js/app.js"></script>

</body>
</html>
