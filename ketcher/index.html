<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ketcher</title>
    <link rel="stylesheet" href="https://unpkg.com/ketcher-react@3.7.0/dist/index.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body, #root {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .ketcher-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .ketcher-spinner .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e0e0e0;
            border-top-color: #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="ketcher-spinner">
            <div class="spinner"></div>
            <div>Loading Ketcher 3.7.0...</div>
        </div>
    </div>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Ketcher -->
    <script src="https://unpkg.com/ketcher-standalone@3.7.0/dist/main.js"></script>
    <script src="https://unpkg.com/ketcher-react@3.7.0/dist/index.js"></script>

    <script>
        // Wait for all scripts to load
        window.addEventListener('load', function() {
            const { Editor } = KetcherReact;
            const { StandaloneStructServiceProvider } = KetcherStandalone;

            // Create struct service provider
            const structServiceProvider = new StandaloneStructServiceProvider();

            // Render Ketcher
            const root = ReactDOM.createRoot(document.getElementById('root'));

            root.render(
                React.createElement(Editor, {
                    staticResourcesUrl: '',
                    structServiceProvider: structServiceProvider,
                    onInit: function(ketcher) {
                        // Expose ketcher globally for parent frame access
                        window.ketcher = ketcher;
                        console.log('Ketcher 3.7.0 initialized');

                        // Notify parent that Ketcher is ready
                        if (window.parent !== window) {
                            window.parent.postMessage({ eventType: 'init' }, '*');
                        }
                    }
                })
            );
        });
    </script>
</body>
</html>
